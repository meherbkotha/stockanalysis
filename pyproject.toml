[project]
name = "stockanalysis"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "dotenv>=0.9.9",
    "ipykernel>=7.4.0",
    "langchain>=1.4.7",
    "langchain-openai>=1.7.3",
    "langchain-pinecone>=0.2.13",
    "langchain-text-splitters>=1.1.3",
    "langgraph>=1.2.19",
    "numpy>=2.5.4",
    "pandas>=3.1.0",
    "pinecone>=7.3.0",
    "pypdf>=6.21.4",
    "streamlit>=1.66.1",
    "yfinance>=1.8.0",
]

[project.scripts]
stockanalysis = "stockanalysis:main"

[build-system]
requires = ["uv_build>=0.13.5,<0.14.0"]
build-backend = "uv_build"
